<label for="startingClub">
                        🏟️ تیم شروع
                    </label>

                    <input
                        type="text"
                        id="startingClub"
                        placeholder="مثلاً Persepolis"
                        required
                    >

                </div>


                <!-- Overall -->

                <div class="form-group">

                    <label for="playerOverall">
                        ⭐ Overall اولیه
                    </label>

                    <input
                        type="number"
                        id="playerOverall"
                        min="40"
                        max="99"
                        value="65"
                        required
                    >

                </div>


                <!-- ارزش بازیکن -->

                <div class="form-group">

                    <label for="playerValue">
                        💰 ارزش بازیکن
                    </label>

                    <input
                        type="number"
                        id="playerValue"
                        min="0"
                        value="500000"
                        required
                    >

                    <small>
                        واحد: €
                    </small>

                </div>


                <!-- حقوق -->

                <div class="form-group">

                    <label for="playerSalary">
                        💵 حقوق
                    </label>

                    <input
                        type="number"
                        id="playerSalary"
                        min="0"
                        value="10000"
                        required
                    >

                    <small>
                        حقوق هفتگی: €
                    </small>

                </div>


                <!-- دکمه -->

                <div class="form-actions">

                    <button
                        type="submit"
                        id="createPlayerBtn"
                    >
                        🚀 ساخت بازیکن و شروع کریر
                    </button>

                </div>


            </form>

        </main>


        <footer>
            Career Football © 2026
        </footer>

    </div>


    <script src="create-player.js"></script>

</body>

</html>
